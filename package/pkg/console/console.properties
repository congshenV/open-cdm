##############################################################
##                                             dmops Proxy ##
##############################################################
# dmops 部署在其它主机时，把前端 /api/dmops/** 的请求转发给它。默认关闭。
#
# base-url 只写到 scheme://host:port，不要带 /api：
#   转发时 targetUrl = base-url + restPath，
#   /api/dmops/v1/hello  ->  http://10.0.0.12:8080/v1/hello
#
# identity.secret 必须与 dmops 的 DMOPS_IDENTITY_SECRET 完全一致；
# 它是密钥，建议用 -Ddmops.proxy.identity.secret=... 在 bin/setenv.sh 里传入，不要写进本文件。
#
# 三项都配好并重启 console 后生效，日志会出现：[DmOpsProxy] enabled, baseUrl=...
#dmops.proxy.enabled=true
#dmops.proxy.base-url=http://10.0.0.12:8080
#dmops.proxy.allowed-path=/v1/
#dmops.proxy.identity.secret=

